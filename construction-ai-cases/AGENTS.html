<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>This is NOT the Next.js you know</title>
<style>
:root {
  --fg: #1f2328;
  --muted: #656d76;
  --bg: #ffffff;
  --border: #d0d7de;
  --code-bg: #f6f8fa;
  --link: #0969da;
}
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue",
               "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
  color: var(--fg);
  background: var(--bg);
  line-height: 1.6;
  margin: 0;
  padding: 2rem 1rem;
}
main {
  max-width: 920px;
  margin: 0 auto;
}
h1, h2, h3, h4, h5, h6 {
  margin-top: 1.8em;
  margin-bottom: 0.6em;
  line-height: 1.25;
  font-weight: 600;
}
h1 { font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
h3 { font-size: 1.25em; }
p, ul, ol, blockquote, table, pre { margin: 0 0 1em; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  background: var(--code-bg);
  padding: 0.2em 0.4em;
  border-radius: 6px;
  font-size: 0.9em;
}
pre {
  background: var(--code-bg);
  padding: 1em;
  border-radius: 6px;
  overflow: auto;
  font-size: 0.9em;
}
pre code { background: transparent; padding: 0; }
blockquote {
  margin: 0 0 1em;
  padding: 0 1em;
  color: var(--muted);
  border-left: 0.25em solid var(--border);
}
table {
  border-collapse: collapse;
  width: 100%;
  display: block;
  overflow: auto;
}
table th, table td {
  border: 1px solid var(--border);
  padding: 0.5em 0.9em;
}
table th { background: var(--code-bg); }
img { max-width: 100%; height: auto; }
hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
ul, ol { padding-left: 2em; }
li + li { margin-top: 0.2em; }
</style>
</head>
<body>
<main>
<!-- BEGIN:nextjs-agent-rules -->
<h1 id="this-is-not-the-nextjs-you-know">This is NOT the Next.js you know</h1>
<p>This version has breaking changes — APIs, conventions, and file structure may all differ from your training data. Read the relevant guide in <code>node_modules/next/dist/docs/</code> before writing any code. Heed deprecation notices.</p>
<!-- END:nextjs-agent-rules -->
</main>
</body>
</html>
