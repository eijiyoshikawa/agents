name: 入札ウォッチ週次通知（AI/SNS）

# 毎週月曜 08:00(JST) に Notion DB の全件サマリを Slack へ通知する。
# cron は UTC。月曜 08:00 JST = 日曜 23:00 UTC。
on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect new cases from 官公需API into Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          COLLECT_WINDOW_DAYS: "14"
        run: python scripts/bid_collect.py

      - name: Notify Slack from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/bid_watch_notify.py
