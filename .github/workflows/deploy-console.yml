name: Deploy Console to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "console/**"
      - "agents/**"
      - "daily_reports/**"
      - "learnings/**"
      - "design-md/**"
      - ".github/workflows/deploy-console.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ github.event.repository.name == 'agents' && '/agents' || '' }}
          # CROSSREPO_TOKEN: fine-grained PAT with Contents:Read-only on cross repos.
          # Falls back to GITHUB_TOKEN (only sees current repo).
          GITHUB_TOKEN: ${{ secrets.CROSSREPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: console/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
